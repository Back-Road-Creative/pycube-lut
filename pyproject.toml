[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycube-lut"
version = "0.1.0"
description = "Read Adobe .cube / HALD CLUT / 1D tone-curve LUTs and apply them to a NumPy image — pure NumPy, no ffmpeg."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Joe Petrucelli", email = "joepetjr@gmail.com" }]
keywords = ["lut", "cube", "hald", "clut", "color-grading", "numpy", "image-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Only the HALD CLUT PNG reader needs Pillow; .cube parsing and applying do not.
hald = ["pillow>=9.0"]
test = ["pytest>=7.0", "pillow>=9.0"]

[tool.hatch.build.targets.wheel]
packages = ["pycube_lut"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
