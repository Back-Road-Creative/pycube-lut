name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  core-without-pillow:
    # The HALD PNG reader is the only thing that needs Pillow. Prove the core
    # install really is NumPy-only, rather than trusting the extra's declaration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import and apply a LUT
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("PIL") is None, "Pillow leaked into the core install"
          import numpy as np
          from pycube_lut import apply_cube, load_cube
          import pathlib, tempfile
          d = pathlib.Path(tempfile.mkdtemp())
          rows = "\n".join(f"{r} {g} {b}" for b in (0, 1) for g in (0, 1) for r in (0, 1))
          (d / "id.cube").write_text(f"LUT_3D_SIZE 2\n{rows}\n")
          out = apply_cube(np.full((4, 4, 3), 128, np.uint8), load_cube(d / "id.cube"))
          assert abs(int(out[0, 0, 0]) - 128) <= 1, out[0, 0]
          print("core install works without Pillow")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.1
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
